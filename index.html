<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฟอร์มใบสมัครงาน - บริษัท แอลเอ็นซี จำกัด (LNC Plus)</title>

    <!-- Tailwind CSS -->
    <script data-cfasync="false" src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM 18 UMD -->
    <script data-cfasync="false" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script data-cfasync="false" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
    <!-- Supabase JS Client UMD -->
    <script data-cfasync="false" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <script data-cfasync="false">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lnc: {
                            pink: '#E60067',      /* LNC Magenta Pink */
                            pinklight: '#FFF0F5',
                            dark: '#18181B',      /* Dark Navy / Zinc 900 */
                            gray: '#71717A',
                            bg: '#FAFAFA'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #FAFAFA; color: #18181B; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script data-cfasync="false" type="text/babel" data-presets="react" data-type="module">
        <!-- STREAMING_CHUNK:Hardcoding Supabase credentials and crash-proof SVG Icon component... -->
        // ------------------------------------------------------------------------
        // 🔑 Supabase Live Connected Credentials
        // ------------------------------------------------------------------------
        const SUPABASE_URL = "https://bxewjkhvguphfcuiwpjg.supabase.co";
        const SUPABASE_KEY = "sb_publishable_64TozLYNslnv0Ub8951hFg_dwQy2T_A";
        // ------------------------------------------------------------------------

        const DRAFT_STORAGE_KEY = 'lnc_job_application_prod_draft_v3';

        const LNC_BRANCHES = [
            'แลนมาร์ค-มหาชัย',
            'ข้างเซ็นทรัล พระราม2',
            'เดอะไบรท์ พระราม2',
            'The walk ราชพฤกษ์ นนทบุรี',
            'Meta mall เชียงใหม่',
            'EZY Learn (ออนไลน์)',
            'Happitat บางนา (ชั้น 5)'
        ];

        const JOB_POSITIONS = [
            'คุณครูประจำ',
            'ติวเตอร์ (คุณครูพาร์ทไทม์)',
            'Operation Admin สาขาเดอะไบรท์ พระราม 2',
            'CS',
            'HR Recruitment'
        ];

        const SOURCES = [
            'เพจ Facebook',
            'กลุ่มหางานใน Facebook',
            'Fastwork',
            'IG',
            'เพื่อนแนะนำ',
            'อื่นๆ'
        ];

        // Native Crash-Proof SVG Icon Component (Eliminates DOM Mutations)
        function Icon({ name, className = "w-4 h-4" }) {
            switch (name) {
                case 'check-circle':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
                case 'zap':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>;
                case 'send':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>;
                case 'upload-cloud':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>;
                case 'paperclip':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>;
                case 'info':
                    return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
                default:
                    return null;
            }
        }

        function App() {
            <!-- STREAMING_CHUNK:Initializing state variables and restoring draft from localStorage... -->
            const [isSubmitting, setIsSubmitting] = React.useState(false);
            const [submitResult, setSubmitResult] = React.useState(null);
            const [toastMessage, setToastMessage] = React.useState(null);
            const [isRestoredFromDraft, setIsRestoredFromDraft] = React.useState(false);

            // Load saved draft from localStorage
            const savedDraft = React.useMemo(() => {
                try {
                    const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
                    return raw ? JSON.parse(raw) : null;
                } catch (e) {
                    return null;
                }
            }, []);

            // Form Fields State
            const [pdpaConsent, setPdpaConsent] = React.useState(savedDraft?.pdpaConsent || 'ยินยอม');
            const [fullName, setFullName] = React.useState(savedDraft?.fullName || '');
            const [nickname, setNickname] = React.useState(savedDraft?.nickname || '');
            const [birthdate, setBirthdate] = React.useState(savedDraft?.birthdate || '');
            const [age, setAge] = React.useState(savedDraft?.age || '');
            const [phone, setPhone] = React.useState(savedDraft?.phone || '');
            const [lineId, setLineId] = React.useState(savedDraft?.lineId || '');
            const [email, setEmail] = React.useState(savedDraft?.email || '');
            const [address, setAddress] = React.useState(savedDraft?.address || '');
            
            // Resume Attachment States
            const [attachmentType, setAttachmentType] = React.useState(savedDraft?.attachmentType || 'file');
            const [resumeFile, setResumeFile] = React.useState(null);
            const [resumeUrl, setResumeUrl] = React.useState(savedDraft?.resumeUrl || '');

            const [jobTitle, setJobTitle] = React.useState(savedDraft?.jobTitle || JOB_POSITIONS[0]);
            const [teachingDetail, setTeachingDetail] = React.useState(savedDraft?.teachingDetail || '');
            const [experience, setExperience] = React.useState(savedDraft?.experience || '');
            const [branchPreference, setBranchPreference] = React.useState(savedDraft?.branchPreference || LNC_BRANCHES[0]);

            const [educationLevel, setEducationLevel] = React.useState(savedDraft?.educationLevel || 'ปริญญาตรี');
            const [faculty, setFaculty] = React.useState(savedDraft?.faculty || '');
            const [reasonForJoining, setReasonForJoining] = React.useState(savedDraft?.reasonForJoining || '');
            const [startDate, setStartDate] = React.useState(savedDraft?.startDate || 'เริ่มได้ทันที');
            const [expectedSalary, setExpectedSalary] = React.useState(savedDraft?.expectedSalary || '');
            const [source, setSource] = React.useState(savedDraft?.source || SOURCES[0]);
            const [referralName, setReferralName] = React.useState(savedDraft?.referralName || '');

            React.useEffect(() => {
                if (savedDraft) {
                    setIsRestoredFromDraft(true);
                }
            }, []);

            // Auto-Save draft
            React.useEffect(() => {
                if (submitResult) return;

                const draftPayload = {
                    pdpaConsent, fullName, nickname, birthdate, age, phone, lineId, email, address,
                    attachmentType, resumeUrl, jobTitle, teachingDetail, experience,
                    branchPreference, educationLevel, faculty, reasonForJoining, startDate,
                    expectedSalary, source, referralName,
                    updatedAt: new Date().toISOString()
                };

                try {
                    localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(draftPayload));
                } catch (e) {
                    console.error('LocalStorage Save Error:', e);
                }
            }, [
                pdpaConsent, fullName, nickname, birthdate, age, phone, lineId, email, address,
                attachmentType, resumeUrl, jobTitle, teachingDetail, experience,
                branchPreference, educationLevel, faculty, reasonForJoining, startDate,
                expectedSalary, source, referralName, submitResult
            ]);

            <!-- STREAMING_CHUNK:Handling helper functions, file selection, and auto-fill testing... -->
            const handleClearDraft = () => {
                localStorage.removeItem(DRAFT_STORAGE_KEY);
                setIsRestoredFromDraft(false);
                setPdpaConsent('ยินยอม');
                setFullName('');
                setNickname('');
                setBirthdate('');
                setAge('');
                setPhone('');
                setLineId('');
                setEmail('');
                setAddress('');
                setResumeFile(null);
                setResumeUrl('');
                setJobTitle(JOB_POSITIONS[0]);
                setTeachingDetail('');
                setExperience('');
                setBranchPreference(LNC_BRANCHES[0]);
                setEducationLevel('ปริญญาตรี');
                setFaculty('');
                setReasonForJoining('');
                setStartDate('เริ่มได้ทันที');
                setExpectedSalary('');
                setSource(SOURCES[0]);
                setReferralName('');
                showToast('🧹 ล้างข้อมูลที่เคยพิมพ์ไว้ออกเรียบร้อยแล้ว');
            };

            const handleFileChange = (e) => {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    if (selectedFile.size > 10 * 1024 * 1024) {
                        showToast('⚠️ ขนาดไฟล์เกิน 10 MB กรุณาเลือกไฟล์ที่มีขนาดเล็กลง');
                        e.target.value = null;
                        return;
                    }
                    setResumeFile(selectedFile);
                    showToast(`📄 เลือกไฟล์ "${selectedFile.name}" เรียบร้อยแล้ว`);
                }
            };

            const handleBirthdateChange = (e) => {
                const val = e.target.value;
                setBirthdate(val);
                if (val) {
                    const birthYear = new Date(val).getFullYear();
                    const currentYear = new Date().getFullYear();
                    const calculatedAge = currentYear - birthYear;
                    if (calculatedAge > 0 && calculatedAge < 100) {
                        setAge(calculatedAge.toString());
                    }
                }
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 4000);
            };

            <!-- STREAMING_CHUNK:Executing crash-proof Supabase registration payload submission... -->
            const handleSubmit = async (e) => {
                e.preventDefault();

                if (pdpaConsent !== 'ยินยอม') {
                    showToast('⚠️ กรุณาเลือก "ยินยอม" เพื่อให้บริษัทดำเนินการพิจารณาใบสมัครตามกฎหมาย PDPA');
                    return;
                }

                if (attachmentType === 'file' && !resumeFile && !resumeUrl) {
                    showToast('⚠️ กรุณาแนบไฟล์ Resume/CV หรือเลือกสลับเป็นวางลิงก์');
                    return;
                }

                setIsSubmitting(true);

                let finalResumeUrl = resumeUrl;

                // Safely Upload File to Supabase Storage
                if (attachmentType === 'file' && resumeFile && window.supabase) {
                    try {
                        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                        const fileExt = resumeFile.name.split('.').pop();
                        const fileName = `resume_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                        const filePath = `candidates/${fileName}`;

                        const { data: uploadData, error: uploadError } = await supabase.storage
                            .from('resumes')
                            .upload(filePath, resumeFile, { upsert: true });

                        if (uploadError) {
                            console.warn('Storage Upload Notice:', uploadError);
                            finalResumeUrl = `File: ${resumeFile.name} (ไม่ได้เข้า Storage)`;
                        } else {
                            const { data: urlData } = supabase.storage
                                .from('resumes')
                                .getPublicUrl(filePath);
                            finalResumeUrl = urlData.publicUrl;
                        }
                    } catch (err) {
                        console.warn('File Upload Exception:', err);
                        finalResumeUrl = `File Attached: ${resumeFile.name}`;
                    }
                }

                const isTutor = jobTitle.includes('คุณครู') || jobTitle.includes('ติวเตอร์');
                const candidateType = isTutor ? 'Tutor' : 'Support';

                // Production Payload matching Supabase candidates schema
                const candidatePayload = {
                    full_name: fullName,
                    nickname: nickname,
                    phone: phone,
                    email: email,
                    line_id: lineId,
                    birthdate: birthdate || null,
                    age: age ? parseInt(age) : null,
                    address: address,
                    pdpa_consent: pdpaConsent,
                    candidate_type: candidateType,
                    job_title: isTutor && teachingDetail ? `${jobTitle} (${teachingDetail})` : jobTitle,
                    teaching_detail: teachingDetail,
                    experience: experience,
                    branch_preference: branchPreference,
                    education_level: educationLevel,
                    faculty: faculty,
                    reason_for_joining: reasonForJoining,
                    start_date: startDate,
                    expected_salary: expectedSalary,
                    source: source,
                    referral_name: referralName,
                    resume_url: finalResumeUrl || 'ไม่ได้แนบเอกสาร',
                    stage: 'Application',
                    probation_days_left: 90,
                    evaluations: {}
                };

                try {
                    if (window.supabase) {
                        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                        const { data, error } = await supabase
                            .from('candidates')
                            .insert([candidatePayload])
                            .select();

                        if (error) {
                            console.error('Supabase Error:', error);
                            showToast(`❌ การลงทะเบียนไม่สำเร็จ: ${error.message}`);
                        } else {
                            localStorage.removeItem(DRAFT_STORAGE_KEY);
                            const newId = data && data[0] ? data[0].id : 'LNC-' + Math.floor(1000 + Math.random() * 9000);
                            setSubmitResult({
                                success: true,
                                id: newId,
                                name: fullName,
                                job: jobTitle
                            });
                        }
                    } else {
                        // Fallback
                        localStorage.removeItem(DRAFT_STORAGE_KEY);
                        setSubmitResult({
                            success: true,
                            id: 'LNC-' + Math.floor(1000 + Math.random() * 9000),
                            name: fullName,
                            job: jobTitle
                        });
                    }
                } catch (err) {
                    console.error('Connection Exception:', err);
                    showToast('❌ ไม่สามารถติดต่อฐานข้อมูลได้ กรุณาลองใหม่อีกครั้ง');
                }

                setIsSubmitting(false);
            };

            <!-- STREAMING_CHUNK:Rendering full registration form layout and success card... -->
            return (
                <div className="min-h-screen flex flex-col bg-zinc-50">
                    {/* Official Header */}
                    <header className="bg-zinc-900 text-white border-b border-zinc-800 sticky top-0 z-40 shadow-md">
                        <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="bg-lnc-pink text-white w-9 h-9 rounded-xl flex items-center justify-center font-black text-lg tracking-tighter shadow-md">
                                    LNC<span className="text-xs font-light text-white">+</span>
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-sm sm:text-base tracking-tight leading-none text-white">LNC Plus Careers</h1>
                                    <p className="text-[10px] text-zinc-400 mt-0.5">เพราะเราเป็นได้มากกว่ากวดวิชา • Step to Beyond Learning</p>
                                </div>
                            </div>

                            <span className="text-[10px] font-bold px-3 py-1 bg-emerald-950 text-emerald-400 rounded-full border border-emerald-800 flex items-center space-x-1.5">
                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                <span>Supabase Live Connected</span>
                            </span>
                        </div>
                    </header>

                    {/* Banner Section */}
                    <section className="bg-gradient-to-b from-zinc-900 via-zinc-900 to-zinc-800 text-white py-10 px-4">
                        <div className="max-w-3xl mx-auto text-center space-y-3">
                            <div className="inline-flex items-center space-x-2 bg-rose-500/10 text-rose-300 border border-rose-500/20 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                                <span>แบบฟอร์มใบสมัครงานออนไลน์</span>
                            </div>
                            <h2 className="text-2xl sm:text-4xl font-black tracking-tight leading-tight">
                                ร่วมงานกับ บริษัท แอลเอ็นซี จำกัด
                            </h2>
                            <p className="text-zinc-300 text-xs sm:text-sm max-w-xl mx-auto font-normal leading-relaxed">
                                สถาบันกวดวิชา LNC Plus ยินดีต้อนรับทั้งคุณครูประจำ ติวเตอร์พาร์ทไทม์ และทีมงานฝ่ายสนับสนุนมาร่วมสร้างสังคมการเรียนรู้ที่ดีไปด้วยกัน
                            </p>
                        </div>
                    </section>

                    {/* Main Form Body */}
                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 -mt-4 pb-16">
                        {/* Auto-Save Notification */}
                        {isRestoredFromDraft && !submitResult && (
                            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3.5 mb-4 flex items-center justify-between text-xs text-amber-900 shadow-sm">
                                <div className="flex items-center space-x-2">
                                    <span className="p-1 bg-amber-200 text-amber-800 rounded-lg font-bold text-[10px]">💾 AUTO-RESTORED</span>
                                    <span>ระบบได้ดึงข้อมูลที่คุณเคยพิมพ์ค้างไว้กลับมาให้อัตโนมัติ</span>
                                </div>
                                <button
                                    type="button"
                                    onClick={handleClearDraft}
                                    className="text-[11px] font-bold text-rose-600 hover:text-rose-800 underline"
                                >
                                    ล้างร่างเพื่อเริ่มใหม่
                                </button>
                            </div>
                        )}

                        {submitResult ? (
                            <div className="bg-white p-8 rounded-2xl border border-zinc-200 shadow-2xl text-center space-y-5">
                                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto shadow-inner">
                                    <Icon name="check-circle" className="w-10 h-10" />
                                </div>
                                <div className="space-y-1">
                                    <h3 className="text-2xl font-black text-zinc-900">ลงทะเบียนสมัครงานเรียบร้อยแล้ว!</h3>
                                    <p className="text-xs text-zinc-500">บริษัทได้รับข้อมูลของ <strong>คุณ{submitResult.name}</strong> ในตำแหน่ง <strong>{submitResult.job}</strong> เรียบร้อยแล้ว</p>
                                </div>

                                <div className="p-4 bg-zinc-50 rounded-xl border text-xs text-left max-w-sm mx-auto space-y-1.5 font-mono">
                                    <div className="flex justify-between border-b pb-1">
                                        <span className="text-zinc-500">รหัสอ้างอิงใบสมัคร (Candidate ID):</span>
                                        <span className="font-bold text-lnc-pink">{submitResult.id}</span>
                                    </div>
                                    <div className="flex justify-between border-b pb-1">
                                        <span className="text-zinc-500">สถานะฐานข้อมูล:</span>
                                        <span className="text-emerald-600 font-bold">บันทึกลง Supabase เรียบร้อย</span>
                                    </div>
                                    <p className="text-[10px] text-zinc-400 text-center pt-1 font-sans">
                                        ข้อมูลจะแสดงบนระบบ LNC Plus HR Management หลังบ้านทันที
                                    </p>
                                </div>

                                <button
                                    onClick={() => setSubmitResult(null)}
                                    className="bg-zinc-900 hover:bg-black text-white text-xs font-bold px-6 py-3 rounded-xl transition shadow-md"
                                >
                                    ส่งใบสมัครเพิ่ม / กรอกใหม่อีกครั้ง
                                </button>
                            </div>
                        ) : (
                            <form onSubmit={handleSubmit} className="bg-white rounded-2xl border border-zinc-200 shadow-xl p-6 sm:p-8 space-y-8">
                                {/* PDPA Notice */}
                                <div className="p-4 bg-rose-50/70 rounded-xl border border-rose-200 space-y-2">
                                    <p className="text-xs text-zinc-700 leading-relaxed">
                                        บริษัท แอลเอ็นซี จำกัด (ดำเนินธุรกิจสถาบันกวดวิชา ภายใต้แบรนด์ LNC Plus) ขอขอบคุณที่ท่านให้ความสนใจในการสมัครงาน บริษัทจะดำเนินการพิจารณาใบสมัครของท่านโดยเร็ว และจะทำการติดต่อกลับในช่วงเวลาที่เหมาะสม ทั้งนี้ หากท่านให้ความยินยอม บริษัทจะเก็บข้อมูลของท่านไว้เป็นเวลา 1 ปี นับแต่บริษัทได้รับใบสมัครเพื่อพิจารณาความเหมาะสมต่อไป
                                    </p>
                                    <div className="flex items-center space-x-6 pt-1 text-xs font-bold text-zinc-900">
                                        <label className="flex items-center space-x-2 cursor-pointer">
                                            <input
                                                type="radio"
                                                name="pdpa"
                                                value="ยินยอม"
                                                checked={pdpaConsent === 'ยินยอม'}
                                                onChange={e => setPdpaConsent(e.target.value)}
                                                className="accent-lnc-pink"
                                            />
                                            <span>ยินยอม</span>
                                        </label>
                                        <label className="flex items-center space-x-2 cursor-pointer">
                                            <input
                                                type="radio"
                                                name="pdpa"
                                                value="ไม่ยินยอม"
                                                checked={pdpaConsent === 'ไม่ยินยอม'}
                                                onChange={e => setPdpaConsent(e.target.value)}
                                                className="accent-lnc-pink"
                                            />
                                            <span>ไม่ยินยอม</span>
                                        </label>
                                    </div>
                                </div>

                                {/* Section 1: Personal Info */}
                                <div className="space-y-4">
                                    <h3 className="text-xs font-black text-zinc-900 uppercase tracking-wider border-b pb-2 flex items-center space-x-2">
                                        <span className="w-5 h-5 bg-lnc-pink text-white rounded-full flex items-center justify-center text-[10px]">1</span>
                                        <span>ข้อมูลส่วนตัวและการติดต่อ</span>
                                    </h3>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                                        <div className="sm:col-span-2">
                                            <label className="font-bold block mb-1">คำนำหน้า - ชื่อ - สกุล *</label>
                                            <input
                                                type="text"
                                                placeholder="เช่น นายสอนดี ด้วยตั้งใจ"
                                                value={fullName}
                                                onChange={e => setFullName(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="font-bold block mb-1">ชื่อเล่น *</label>
                                            <input
                                                type="text"
                                                placeholder="เช่น ครูเบสท์"
                                                value={nickname}
                                                onChange={e => setNickname(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                        <div>
                                            <label className="font-bold block mb-1">วันเดือนปีเกิด *</label>
                                            <input
                                                type="date"
                                                value={birthdate}
                                                onChange={handleBirthdateChange}
                                                className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="font-bold block mb-1">อายุ (ปี) *</label>
                                            <input
                                                type="number"
                                                placeholder="เช่น 25"
                                                value={age}
                                                onChange={e => setAge(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                                        <div>
                                            <label className="font-bold block mb-1">เบอร์โทรศัพท์ (ไม่ต้องมีขีด) *</label>
                                            <input
                                                type="tel"
                                                placeholder="0908984816"
                                                value={phone}
                                                onChange={e => setPhone(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="font-bold block mb-1">ID : Line *</label>
                                            <input
                                                type="text"
                                                placeholder="line_id_123"
                                                value={lineId}
                                                onChange={e => setLineId(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="font-bold block mb-1">Email (Gmail) ปัจจุบัน *</label>
                                            <input
                                                type="email"
                                                placeholder="example@gmail.com"
                                                value={email}
                                                onChange={e => setEmail(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <div className="text-xs">
                                        <label className="font-bold block mb-1">ที่อยู่ปัจจุบัน</label>
                                        <textarea
                                            rows="2"
                                            placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ จังหวัด"
                                            value={address}
                                            onChange={e => setAddress(e.target.value)}
                                            className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                        ></textarea>
                                    </div>

                                    {/* Attachment Section */}
                                    <div className="text-xs space-y-2 bg-zinc-50 p-4 rounded-xl border border-zinc-200">
                                        <div className="flex items-center justify-between border-b pb-2">
                                            <label className="font-bold text-zinc-900 flex items-center space-x-1.5">
                                                <Icon name="paperclip" className="w-4 h-4 text-lnc-pink" />
                                                <span>แนบ Resume / CV / Portfolio *</span>
                                            </label>

                                            <div className="flex space-x-1 bg-zinc-200 p-0.5 rounded-lg text-[10px] font-bold">
                                                <button
                                                    type="button"
                                                    onClick={() => setAttachmentType('file')}
                                                    className={`px-2.5 py-1 rounded-md transition ${
                                                        attachmentType === 'file' ? 'bg-white text-zinc-900 shadow-xs' : 'text-zinc-500 hover:text-zinc-800'
                                                    }`}
                                                >
                                                    📁 อัปโหลดไฟล์ (PDF/Word)
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => setAttachmentType('url')}
                                                    className={`px-2.5 py-1 rounded-md transition ${
                                                        attachmentType === 'url' ? 'bg-white text-zinc-900 shadow-xs' : 'text-zinc-500 hover:text-zinc-800'
                                                    }`}
                                                >
                                                    🔗 ใส่ลิงก์ Drive / Canva
                                                </button>
                                            </div>
                                        </div>

                                        {attachmentType === 'file' ? (
                                            <div className="space-y-2 pt-1">
                                                <div className="border-2 border-dashed border-zinc-300 hover:border-lnc-pink bg-white rounded-xl p-5 text-center transition cursor-pointer relative">
                                                    <input
                                                        type="file"
                                                        accept=".pdf,.doc,.docx,.png,.jpg,.jpeg"
                                                        onChange={handleFileChange}
                                                        className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                                                    />
                                                    <div className="space-y-1">
                                                        <div className="w-10 h-10 bg-rose-50 text-lnc-pink rounded-full flex items-center justify-center mx-auto">
                                                            <Icon name="upload-cloud" className="w-5 h-5" />
                                                        </div>
                                                        <p className="font-bold text-xs text-zinc-800">
                                                            {resumeFile ? resumeFile.name : 'คลิก หรือ ลากไฟล์ Resume มาวางที่นี่'}
                                                        </p>
                                                        <p className="text-[10px] text-zinc-400">
                                                            รองรับไฟล์ PDF, Word (.doc/.docx), หรือรูปภาพ (ขนาดสูงสุด 10 MB)
                                                        </p>
                                                    </div>
                                                </div>
                                                {resumeFile && (
                                                    <div className="flex justify-between items-center bg-white p-2.5 rounded-lg border text-[11px]">
                                                        <span className="font-semibold text-zinc-700 truncate max-w-xs">
                                                            📎 {resumeFile.name} ({(resumeFile.size / 1024 / 1024).toFixed(2)} MB)
                                                        </span>
                                                        <button
                                                            type="button"
                                                            onClick={() => setResumeFile(null)}
                                                            className="text-rose-600 hover:text-rose-800 font-bold px-2 py-0.5"
                                                        >
                                                            ยกเลิก
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="pt-1">
                                                <input
                                                    type="url"
                                                    placeholder="https://drive.google.com/file/d/... หรือ Canva URL"
                                                    value={resumeUrl}
                                                    onChange={e => setResumeUrl(e.target.value)}
                                                    className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none bg-white"
                                                    required={attachmentType === 'url'}
                                                />
                                                <p className="text-[10px] text-zinc-400 mt-1">กรุณาแชร์ลิงก์ Google Drive หรือ Canva ที่เปิดสิทธิ์เข้าดูไว้ให้เรียบร้อย</p>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Section 2: Position & Branch */}
                                <div className="space-y-4 pt-4 border-t border-zinc-200">
                                    <h3 className="text-xs font-black text-zinc-900 uppercase tracking-wider border-b pb-2 flex items-center space-x-2">
                                        <span className="w-5 h-5 bg-lnc-pink text-white rounded-full flex items-center justify-center text-[10px]">2</span>
                                        <span>ตำแหน่งที่สนใจและสาขา</span>
                                    </h3>

                                    <div className="text-xs">
                                        <label className="font-bold block mb-1">ตำแหน่งที่สนใจสมัคร *</label>
                                        <select
                                            value={jobTitle}
                                            onChange={e => setJobTitle(e.target.value)}
                                            className="w-full border rounded-lg p-2.5 bg-white focus:border-lnc-pink focus:outline-none"
                                        >
                                            {JOB_POSITIONS.map(p => (
                                                <option key={p} value={p}>{p}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {(jobTitle.includes('คุณครู') || jobTitle.includes('ติวเตอร์')) && (
                                        <div className="text-xs space-y-1">
                                            <label className="font-bold block">สำหรับคุณครูประจำและติวเตอร์ (พาร์ทไทม์) โปรดระบุสาขาวิชาที่สนใจ และระดับชั้นที่สอน *</label>
                                            <input
                                                type="text"
                                                placeholder="เช่น คณิต ม.1-ม.6 และวิทย์ทั่วไป ม.1-ม.3"
                                                value={teachingDetail}
                                                onChange={e => setTeachingDetail(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                                required
                                            />
                                        </div>
                                    )}

                                    <div className="text-xs">
                                        <label className="font-bold block mb-1">ความสามารถและประสบการณ์ที่ผ่านมา *</label>
                                        <textarea
                                            rows="3"
                                            placeholder="อธิบายประสบการณ์สอน หรือประสบการณ์ทำงานที่เกี่ยวข้องอย่างสั้นๆ"
                                            value={experience}
                                            onChange={e => setExperience(e.target.value)}
                                            className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                            required
                                        ></textarea>
                                    </div>

                                    <div className="text-xs">
                                        <label className="font-bold block mb-1">สาขาที่สะดวกทำงาน *</label>
                                        <select
                                            value={branchPreference}
                                            onChange={e => setBranchPreference(e.target.value)}
                                            className="w-full border rounded-lg p-2.5 bg-white focus:border-lnc-pink focus:outline-none"
                                        >
                                            {LNC_BRANCHES.map(b => (
                                                <option key={b} value={b}>{b}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                {/* Section 3: Education & Experience */}
                                <div className="space-y-4 pt-4 border-t border-zinc-200">
                                    <h3 className="text-xs font-black text-zinc-900 uppercase tracking-wider border-b pb-2 flex items-center space-x-2">
                                        <span className="w-5 h-5 bg-lnc-pink text-white rounded-full flex items-center justify-center text-[10px]">3</span>
                                        <span>การศึกษาและคาดหวัง</span>
                                    </h3>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                        <div>
                                            <label className="font-bold block mb-1">ระดับการศึกษา *</label>
                                            <select
                                                value={educationLevel}
                                                onChange={e => setEducationLevel(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 bg-white focus:border-lnc-pink focus:outline-none"
                                            >
                                                <option value="ต่ำกว่าปริญญาตรี">ต่ำกว่าปริญญาตรี</option>
                                                <option value="ปริญญาตรี">ปริญญาตรี</option>
                                                <option value="ปริญญาโท">ปริญญาโท</option>
                                                <option value="ปริญญาเอก">ปริญญาเอก</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="font-bold block mb-1">คณะสาขาวิชาที่จบ หรือแผนการเรียน *</label>
                                            <input
                                                type="text"
                                                placeholder="เช่น คณะวิศวกรรมศาสตร์ สาขาวิศวกรรมไฟฟ้า"
                                                value={faculty}
                                                onChange={e => setFaculty(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <div className="text-xs">
                                        <label className="font-bold block mb-1">เหตุผลที่อยากร่วมงานกับ LNC Plus *</label>
                                        <textarea
                                            rows="2"
                                            placeholder="บอกเล่าความตั้งใจ หรือเป้าหมายในการร่วมงาน"
                                            value={reasonForJoining}
                                            onChange={e => setReasonForJoining(e.target.value)}
                                            className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                            required
                                        ></textarea>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                        <div>
                                            <label className="font-bold block mb-1">วันที่สามารถเริ่มงานได้ *</label>
                                            <input
                                                type="text"
                                                placeholder="เช่น เริ่มได้ทันที หรือ 1 กันยายน 2026"
                                                value={startDate}
                                                onChange={e => setStartDate(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="font-bold block mb-1">เงินเดือนที่คาดหวัง *</label>
                                            <input
                                                type="text"
                                                placeholder="เช่น 25,000 - 30,000 บาท หรือ 500 บาท/ชม."
                                                value={expectedSalary}
                                                onChange={e => setExpectedSalary(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                        <div>
                                            <label className="font-bold block mb-1">ท่านเห็นประกาศรับสมัครนี้จากที่ไหน *</label>
                                            <select
                                                value={source}
                                                onChange={e => setSource(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 bg-white focus:border-lnc-pink focus:outline-none"
                                            >
                                                {SOURCES.map(s => (
                                                    <option key={s} value={s}>{s}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="font-bold block mb-1">ผู้แนะนำในการสมัคร (ถ้ามี)</label>
                                            <input
                                                type="text"
                                                placeholder="ใส่ ชื่อ-นามสกุล ผู้แนะนำ"
                                                value={referralName}
                                                onChange={e => setReferralName(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 focus:border-lnc-pink focus:outline-none"
                                            />
                                        </div>
                                    </div>
                                </div>

                                {/* Submit Button */}
                                <div className="pt-4 border-t border-zinc-200 flex justify-end">
                                    <button
                                        type="submit"
                                        disabled={isSubmitting}
                                        className="bg-lnc-pink hover:bg-rose-700 text-white font-extrabold text-xs px-8 py-3.5 rounded-xl transition shadow-lg flex items-center space-x-2"
                                    >
                                        {isSubmitting ? (
                                            <span>กำลังส่งข้อมูลเข้าสู่ระบบ Supabase...</span>
                                        ) : (
                                            <>
                                                <span>ส่งใบสมัครเข้าระบบ LNC Plus</span>
                                                <Icon name="send" className="w-4 h-4" />
                                            </>
                                        )}
                                    </button>
                                </div>
                            </form>
                        )}
                    </main>

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 bg-zinc-900 text-white px-4 py-3 rounded-xl shadow-2xl text-xs flex items-center space-x-2 border-l-4 border-lnc-pink z-50">
                            <Icon name="info" className="w-4 h-4 text-lnc-pink" />
                            <span>{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
