<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร่วมงานกับ LNC Plus - แบบฟอร์มใบสมัครงาน (Step to Beyond Learning)</title>

    <!-- Tailwind CSS -->
    <script data-cfasync="false" src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM 18 UMD -->
    <script data-cfasync="false" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script data-cfasync="false" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

    <script data-cfasync="false">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lnc: {
                            pink: '#E60067',
                            pinklight: '#FFF0F5',
                            dark: '#18181B',
                            gray: '#71717A',
                            bg: '#FAFAFA'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #FAFAFA; color: #18181B; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script data-cfasync="false" type="text/babel" data-presets="react" data-type="module">
        /* ------------------------------------------------------------------------ */
        /* 🔑 นำ Web App URL จาก Google Apps Script (doGet/doPost) มาวางที่นี่         */
        /* ------------------------------------------------------------------------ */
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwbjau3ityZ2sbVa8EDaun6YiuwlKZRzV3Y-HTCo96zb6_Wlha25sMZzd_7AALbAkIBIg/exec";
        /* ------------------------------------------------------------------------ */

        const DRAFT_STORAGE_KEY = 'lnc_job_application_draft_v6';

        const LNC_BRANCHES = [
            'แลนมาร์ค-มหาชัย',
            'ข้างเซ็นทรัล พระราม2',
            'เดอะไบรท์ พระราม2',
            'The walk ราชพฤกษ์ นนทบุรี',
            'Meta mall เชียงใหม่',
            'EZY Learn (ออนไลน์)',
            'Happitat บางนา (ชั้น 5)'
        ];

        const JOB_POSITIONS = [
            'คุณครูประจำ',
            'ติวเตอร์ (คุณครูพาร์ทไทม์)',
            'Operation Admin สาขาเดอะไบรท์ พระราม 2',
            'CS',
            'HR Recruitment'
        ];

        const SOURCES = [
            'เพจ Facebook',
            'กลุ่มหางานใน Facebook',
            'Fastwork',
            'IG',
            'เพื่อนแนะนำ',
            'อื่นๆ'
        ];

        function Icon({ name, className = "w-4 h-4" }) {
            switch (name) {
                case 'check-circle': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
                case 'send': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>;
                case 'upload-cloud': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>;
                case 'paperclip': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>;
                case 'info': return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
                default: return null;
            }
        }

        function App() {
            const [isSubmitting, setIsSubmitting] = React.useState(false);
            const [submitResult, setSubmitResult] = React.useState(null);
            const [toastMessage, setToastMessage] = React.useState(null);
            const [isRestoredFromDraft, setIsRestoredFromDraft] = React.useState(false);

            const savedDraft = React.useMemo(() => {
                try {
                    const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
                    return raw ? JSON.parse(raw) : null;
                } catch (e) { return null; }
            }, []);

            const [pdpaConsent, setPdpaConsent] = React.useState(savedDraft?.pdpaConsent || 'ยินยอม');
            const [fullName, setFullName] = React.useState(savedDraft?.fullName || '');
            const [nickname, setNickname] = React.useState(savedDraft?.nickname || '');
            const [birthdate, setBirthdate] = React.useState(savedDraft?.birthdate || '');
            const [age, setAge] = React.useState(savedDraft?.age || '');
            const [phone, setPhone] = React.useState(savedDraft?.phone || '');
            const [lineId, setLineId] = React.useState(savedDraft?.lineId || '');
            const [email, setEmail] = React.useState(savedDraft?.email || '');
            const [address, setAddress] = React.useState(savedDraft?.address || '');
            
            // File Upload States
            const [resumeFile, setResumeFile] = React.useState(null);
            const [resumeBase64, setResumeBase64] = React.useState('');
            const [resumeFileName, setResumeFileName] = React.useState('');
            const [resumeMimeType, setResumeMimeType] = React.useState('');

            const [jobTitle, setJobTitle] = React.useState(savedDraft?.jobTitle || JOB_POSITIONS[0]);
            const [teachingDetail, setTeachingDetail] = React.useState(savedDraft?.teachingDetail || '');
            const [experience, setExperience] = React.useState(savedDraft?.experience || '');
            const [branchPreference, setBranchPreference] = React.useState(savedDraft?.branchPreference || LNC_BRANCHES[0]);

            const [educationLevel, setEducationLevel] = React.useState(savedDraft?.educationLevel || 'ปริญญาตรี');
            const [faculty, setFaculty] = React.useState(savedDraft?.faculty || '');
            const [reasonForJoining, setReasonForJoining] = React.useState(savedDraft?.reasonForJoining || '');
            const [startDate, setStartDate] = React.useState(savedDraft?.startDate || 'เริ่มได้ทันที');
            const [expectedSalary, setExpectedSalary] = React.useState(savedDraft?.expectedSalary || '');
            const [source, setSource] = React.useState(savedDraft?.source || SOURCES[0]);
            const [referralName, setReferralName] = React.useState(savedDraft?.referralName || '');

            React.useEffect(() => {
                if (savedDraft) setIsRestoredFromDraft(true);
            }, []);

            React.useEffect(() => {
                if (submitResult) return;
                const draftPayload = {
                    pdpaConsent, fullName, nickname, birthdate, age, phone, lineId, email, address,
                    jobTitle, teachingDetail, experience, branchPreference, educationLevel, faculty,
                    reasonForJoining, startDate, expectedSalary, source, referralName
                };
                try { localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(draftPayload)); } catch (e) {}
            }, [
                pdpaConsent, fullName, nickname, birthdate, age, phone, lineId, email, address,
                jobTitle, teachingDetail, experience, branchPreference, educationLevel, faculty,
                reasonForJoining, startDate, expectedSalary, source, referralName, submitResult
            ]);

            const handleClearDraft = () => {
                localStorage.removeItem(DRAFT_STORAGE_KEY);
                setIsRestoredFromDraft(false);
                setPdpaConsent('ยินยอม'); setFullName(''); setNickname(''); setBirthdate(''); setAge('');
                setPhone(''); setLineId(''); setEmail(''); setAddress(''); setResumeFile(null);
                setResumeBase64(''); setResumeFileName(''); setResumeMimeType('');
                setJobTitle(JOB_POSITIONS[0]); setTeachingDetail(''); setExperience('');
                setBranchPreference(LNC_BRANCHES[0]); setEducationLevel('ปริญญาตรี'); setFaculty('');
                setReasonForJoining(''); setStartDate('เริ่มได้ทันที'); setExpectedSalary('');
                setSource(SOURCES[0]); setReferralName('');
                showToast('🧹 ล้างข้อมูลที่กรอกค้างไว้เรียบร้อย');
            };

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 10 * 1024 * 1024) {
                        showToast('⚠️ ขนาดไฟล์เกิน 10 MB กรุณาเลือกไฟล์ที่เล็กกว่า');
                        return;
                    }
                    setResumeFile(file);
                    setResumeFileName(file.name);
                    setResumeMimeType(file.type);

                    const reader = new FileReader();
                    reader.onload = (uploadEvent) => {
                        setResumeBase64(uploadEvent.target.result);
                        showToast(`📄 แนบไฟล์ "${file.name}" เรียบร้อยแล้ว`);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleBirthdateChange = (e) => {
                const val = e.target.value;
                setBirthdate(val);
                if (val) {
                    const birthYear = new Date(val).getFullYear();
                    const currentYear = new Date().getFullYear();
                    const calcAge = currentYear - birthYear;
                    if (calcAge > 0 && calcAge < 100) setAge(calcAge.toString());
                }
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 4000);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                if (pdpaConsent !== 'ยินยอม') {
                    showToast('⚠️ กรุณาเลือก "ยินยอม" ตามเงื่อนไข PDPA');
                    return;
                }

                if (!resumeFile) {
                    showToast('⚠️ กรุณาแนบไฟล์ Resume / CV ของท่าน');
                    return;
                }

                if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_GAS_DEPLOYMENT_ID")) {
                    showToast('❌ กรุณานำ Web App URL จาก Google Apps Script มาใส่ในโค้ดก่อน');
                    return;
                }

                setIsSubmitting(true);

                const isTutor = jobTitle.includes('คุณครู') || jobTitle.includes('ติวเตอร์');
                const candidateType = isTutor ? 'Tutor' : 'Support';

                const payload = {
                    full_name: fullName,
                    nickname: nickname,
                    birthdate: birthdate,
                    age: age,
                    phone: phone,
                    line_id: lineId,
                    email: email,
                    address: address,
                    pdpa_consent: pdpaConsent,
                    candidate_type: candidateType,
                    job_title: isTutor && teachingDetail ? `${jobTitle} (${teachingDetail})` : jobTitle,
                    teaching_detail: teachingDetail,
                    experience: experience,
                    branch_preference: branchPreference,
                    education_level: educationLevel,
                    faculty: faculty,
                    reason_for_joining: reasonForJoining,
                    start_date: startDate,
                    expected_salary: expectedSalary,
                    source: source,
                    referral_name: referralName,
                    fileData: resumeBase64,
                    fileName: resumeFileName,
                    fileMimeType: resumeMimeType
                };

                try {
                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();

                    if (result.status === 'success') {
                        localStorage.removeItem(DRAFT_STORAGE_KEY);
                        setSubmitResult({
                            id: result.id,
                            name: fullName,
                            job: jobTitle
                        });
                    } else {
                        showToast('❌ บันทึกไม่สำเร็จ: ' + result.message);
                    }
                } catch (err) {
                    console.error(err);
                    showToast('❌ ไม่สามารถเชื่อมต่อกับ Google Sheet ได้');
                }

                setIsSubmitting(false);
            };

            return (
                <div className="min-h-screen flex flex-col bg-zinc-50">
                    <header className="bg-zinc-900 text-white border-b border-zinc-800 sticky top-0 z-40 shadow-md">
                        <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="bg-lnc-pink text-white w-9 h-9 rounded-xl flex items-center justify-center font-black text-lg">
                                    LNC<span className="text-xs font-light">+</span>
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-sm sm:text-base text-white">LNC Plus Careers</h1>
                                    <p className="text-[10px] text-zinc-400">Step to Beyond Learning</p>
                                </div>
                            </div>
                            <span className="text-[10px] font-bold px-3 py-1 bg-emerald-950 text-emerald-400 rounded-full border border-emerald-800">
                                Google Sheets Connected
                            </span>
                        </div>
                    </header>

                    <section className="bg-gradient-to-b from-zinc-900 to-zinc-800 text-white py-10 px-4">
                        <div className="max-w-3xl mx-auto text-center space-y-3">
                            <span className="bg-rose-500/10 text-rose-300 border border-rose-500/20 px-3 py-1 rounded-full text-xs font-bold uppercase">
                                แบบฟอร์มใบสมัครงานออนไลน์ (อัปโหลดไฟล์ได้)
                            </span>
                            <h2 className="text-2xl sm:text-4xl font-black">ร่วมงานกับ บริษัท แอลเอ็นซี จำกัด</h2>
                        </div>
                    </section>

                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 -mt-4 pb-16">
                        {isRestoredFromDraft && !submitResult && (
                            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3.5 mb-4 flex items-center justify-between text-xs text-amber-900 shadow-sm">
                                <span>💾 ดึงข้อมูลที่คุณกรอกค้างไว้กลับมาให้อัตโนมัติ</span>
                                <button type="button" onClick={handleClearDraft} className="font-bold text-rose-600 underline">ล้างร่างเพื่อเริ่มใหม่</button>
                            </div>
                        )}

                        {submitResult ? (
                            <div className="bg-white p-8 rounded-2xl border shadow-2xl text-center space-y-5">
                                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
                                    <Icon name="check-circle" className="w-10 h-10" />
                                </div>
                                <h3 className="text-2xl font-black text-zinc-900">ส่งใบสมัครเรียบร้อยแล้ว!</h3>
                                <div className="p-4 bg-zinc-50 rounded-xl border text-xs text-left max-w-sm mx-auto space-y-1 font-mono">
                                    <div>รหัสอ้างอิง: <strong className="text-lnc-pink">{submitResult.id}</strong></div>
                                    <div>สถานะ: <span className="text-emerald-600 font-bold">บันทึกลง Google Sheets สำเร็จ</span></div>
                                </div>
                                <button onClick={() => setSubmitResult(null)} className="bg-zinc-900 text-white text-xs font-bold px-6 py-3 rounded-xl">ส่งใบสมัครเพิ่ม</button>
                            </div>
                        ) : (
                            <form onSubmit={handleSubmit} className="bg-white rounded-2xl border shadow-xl p-6 sm:p-8 space-y-8">
                                {/* PDPA */}
                                <div className="p-4 bg-rose-50 rounded-xl border border-rose-200 space-y-2 text-xs">
                                    <p className="text-zinc-700 leading-relaxed">บริษัท แอลเอ็นซี จำกัด ขอขอบคุณที่ท่านให้ความสนใจในการสมัครงาน บริษัทจะเก็บรักษาข้อมูลของท่านไว้ 1 ปีตามกฎหมาย PDPA</p>
                                    <div className="flex space-x-6 font-bold">
                                        <label className="flex items-center space-x-2"><input type="radio" name="pdpa" value="ยินยอม" checked={pdpaConsent === 'ยินยอม'} onChange={e => setPdpaConsent(e.target.value)} className="accent-lnc-pink" /><span>ยินยอม</span></label>
                                        <label className="flex items-center space-x-2"><input type="radio" name="pdpa" value="ไม่ยินยอม" checked={pdpaConsent === 'ไม่ยินยอม'} onChange={e => setPdpaConsent(e.target.value)} className="accent-lnc-pink" /><span>ไม่ยินยอม</span></label>
                                    </div>
                                </div>

                                {/* Personal */}
                                <div className="space-y-4 text-xs">
                                    <h3 className="font-black uppercase border-b pb-2">1. ข้อมูลส่วนตัวและการติดต่อ</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div className="sm:col-span-2"><label className="font-bold block mb-1">ชื่อ - นามสกุล *</label><input type="text" value={fullName} onChange={e => setFullName(e.target.value)} className="w-full border rounded-lg p-2.5" required /></div>
                                        <div><label className="font-bold block mb-1">ชื่อเล่น *</label><input type="text" value={nickname} onChange={e => setNickname(e.target.value)} className="w-full border rounded-lg p-2.5" required /></div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div><label className="font-bold block mb-1">วันเดือนปีเกิด *</label><input type="date" value={birthdate} onChange={handleBirthdateChange} className="w-full border rounded-lg p-2.5" required /></div>
                                        <div><label className="font-bold block mb-1">อายุ (ปี) *</label><input type="number" value={age} onChange={e => setAge(e.target.value)} className="w-full border rounded-lg p-2.5" required /></div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div><label className="font-bold block mb-1">เบอร์โทรศัพท์ *</label><input type="tel" value={phone} onChange={e => setPhone(e.target.value)} className="w-full border rounded-lg p-2.5" required /></div>
                                        <div><label className="font-bold block mb-1">ID Line *</label><input type="text" value={lineId} onChange={e => setLineId(e.target.value)} className="w-full border rounded-lg p-2.5" required /></div>
                                        <div><label className="font-bold block mb-1">Email *</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full border rounded-lg p-2.5" required /></div>
                                    </div>
                                    <div><label className="font-bold block mb-1">ที่อยู่ปัจจุบัน</label><textarea rows="2" value={address} onChange={e => setAddress(e.target.value)} className="w-full border rounded-lg p-2.5"></textarea></div>

                                    {/* File Upload Component */}
                                    <div className="space-y-2 bg-zinc-50 p-4 rounded-xl border">
                                        <label className="font-bold text-zinc-900 flex items-center space-x-1.5">
                                            <Icon name="paperclip" className="w-4 h-4 text-lnc-pink" />
                                            <span>อัปโหลด Resume / CV / Portfolio (PDF หรือ Word ไม่เกิน 10MB) *</span>
                                        </label>
                                        <div className="border-2 border-dashed border-zinc-300 hover:border-lnc-pink bg-white rounded-xl p-5 text-center cursor-pointer relative">
                                            <input type="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" onChange={handleFileChange} className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" required={!resumeFile} />
                                            <div className="space-y-1">
                                                <div className="w-10 h-10 bg-rose-50 text-lnc-pink rounded-full flex items-center justify-center mx-auto"><Icon name="upload-cloud" className="w-5 h-5" /></div>
                                                <p className="font-bold text-xs text-zinc-800">{resumeFile ? resumeFile.name : 'คลิก หรือ ลากไฟล์ Resume มาวางที่นี่'}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Position & Branch */}
                                <div className="space-y-4 text-xs pt-4 border-t">
                                    <h3 className="font-black uppercase border-b pb-2">2. ตำแหน่งและสาขา</h3>
                                    <div>
                                        <label className="font-bold block mb-1">ตำแหน่งที่สนใจสมัคร *</label>
                                        <select value={jobTitle} onChange={e => setJobTitle(e.target.value)} className="w-full border rounded-lg p-2.5 bg-white">
                                            {JOB_POSITIONS.map(p => <option key={p} value={p}>{p}</option>)}
                                        </select>
                                    </div>
                                    {(jobTitle.includes('คุณครู') || jobTitle.includes('ติวเตอร์')) && (
                                        <div>
                                            <label className="font-bold block mb-1">ระบุสาขาวิชาและระดับชั้นที่สอน *</label>
                                            <input type="text" placeholder="เช่น คณิต ม.1-ม.6" value={teachingDetail} onChange={e => setTeachingDetail(e.target.value)} className="w-full border rounded-lg p-2.5" required />
                                        </div>
                                    )}
                                    <div><label className="font-bold block mb-1">ความสามารถและประสบการณ์ที่ผ่านมา *</label><textarea rows="3" value={experience} onChange={e => setExperience(e.target.value)} className="w-full border rounded-lg p-2.5" required></textarea></div>
                                    <div>
                                        <label className="font-bold block mb-1">สาขาที่สะดวกทำงาน *</label>
                                        <select value={branchPreference} onChange={e => setBranchPreference(e.target.value)} className="w-full border rounded-lg p-2.5 bg-white">
                                            {LNC_BRANCHES.map(b => <option key={b} value={b}>{b}</option>)}
                                        </select>
                                    </div>
                                </div>

                                {/* Education */}
                                <div className="space-y-4 text-xs pt-4 border-t">
                                    <h3 className="font-black uppercase border-b pb-2">3. การศึกษาและคาดหวัง</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="font-bold block mb-1">ระดับการศึกษา *</label>
                                            <select value={educationLevel} onChange={e => setEducationLevel(e.target.value)} className="w-full border rounded-lg p-2.5 bg-white">
                                                <option value="ปริญญาตรี">ปริญญาตรี</option>
                                                <option value="ปริญญาโท">ปริญญาโท</option>
                                                <option value="ปริญญาเอก">ปริญญาเอก</option>
                                            </select>
                                        </div>
                                        <div><label className="font-bold block mb-1">คณะ / สาขาวิชา *</label><input type="text" value={faculty} onChange={e => setFaculty(e.target.value)} className="w-full border rounded-lg p-2.5" required /></div>
                                    </div>
                                    <div><label className="font-bold block mb-1">เหตุผลที่อยากร่วมงานกับ LNC Plus *</label><textarea rows="2" value={reasonForJoining} onChange={e => setReasonForJoining(e.target.value)} className="w-full border rounded-lg p-2.5" required></textarea></div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div><label className="font-bold block mb-1">เริ่มงานได้เมื่อไหร่ *</label><input type="text" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full border rounded-lg p-2.5" required /></div>
                                        <div><label className="font-bold block mb-1">เงินเดือนที่คาดหวัง *</label><input type="text" value={expectedSalary} onChange={e => setExpectedSalary(e.target.value)} className="w-full border rounded-lg p-2.5" required /></div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="font-bold block mb-1">เห็นประกาศจากไหน *</label>
                                            <select value={source} onChange={e => setSource(e.target.value)} className="w-full border rounded-lg p-2.5 bg-white">
                                                {SOURCES.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                        <div><label className="font-bold block mb-1">ผู้แนะนำ (ถ้ามี)</label><input type="text" value={referralName} onChange={e => setReferralName(e.target.value)} className="w-full border rounded-lg p-2.5" /></div>
                                    </div>
                                </div>

                                <div className="pt-4 border-t flex justify-end">
                                    <button type="submit" disabled={isSubmitting} className="bg-lnc-pink hover:bg-rose-700 text-white font-extrabold text-xs px-8 py-3.5 rounded-xl shadow-lg flex items-center space-x-2">
                                        {isSubmitting ? <span>กำลังอัปโหลดไฟล์และส่งใบสมัคร...</span> : <><span>ส่งใบสมัครเข้าระบบ LNC Plus</span><Icon name="send" className="w-4 h-4" /></>}
                                    </button>
                                </div>
                            </form>
                        )}
                    </main>

                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 bg-zinc-900 text-white px-4 py-3 rounded-xl shadow-2xl text-xs flex items-center space-x-2 border-l-4 border-lnc-pink z-50">
                            <Icon name="info" className="w-4 h-4 text-lnc-pink" />
                            <span>{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
